<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Walking with Sword</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
            z-index: 1000;
        }
        #instructions {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: white;
            font-family: Arial, sans-serif;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="loading">
        <h2>Generating your sword...</h2>
        <p>Please wait while the AI creates your weapon</p>
    </div>
    <div id="instructions">
        <p>WASD or Arrow Keys: Move | Mouse: Look around</p>
    </div>
    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Sky blue
        
        // Camera setup
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.y = 1.7; // Eye height
        
        // Renderer setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        // Light setup
        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(1, 1, 0.5);
        directionalLight.castShadow = true;
        scene.add(directionalLight);
        
        // Ground plane
        const planeGeometry = new THREE.PlaneGeometry(2000, 2000);
        const planeMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x339933,
            side: THREE.DoubleSide
        });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);
        
        // Controls setup
        const controls = new PointerLockControls(camera, document.body);
        
        document.addEventListener('click', function() {
            controls.lock();
        });
        
        controls.addEventListener('lock', function() {
            document.getElementById('instructions').style.display = 'none';
        });
        
        controls.addEventListener('unlock', function() {
            document.getElementById('instructions').style.display = 'block';
        });
        
        // Movement variables
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        
        // Handle key controls
        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);
        
        function onKeyDown(event) {
            switch(event.code) {
                case 'ArrowUp':
                case 'KeyW':
                    moveForward = true;
                    break;
                case 'ArrowLeft':
                case 'KeyA':
                    moveLeft = true;
                    break;
                case 'ArrowDown':
                case 'KeyS':
                    moveBackward = true;
                    break;
                case 'ArrowRight':
                case 'KeyD':
                    moveRight = true;
                    break;
            }
        }
        
        function onKeyUp(event) {
            switch(event.code) {
                case 'ArrowUp':
                case 'KeyW':
                    moveForward = false;
                    break;
                case 'ArrowLeft':
                case 'KeyA':
                    moveLeft = false;
                    break;
                case 'ArrowDown':
                case 'KeyS':
                    moveBackward = false;
                    break;
                case 'ArrowRight':
                case 'KeyD':
                    moveRight = false;
                    break;
            }
        }
        
        // Sword in right hand
        let sword = null;
        let handOffset = new THREE.Object3D();
        camera.add(handOffset);
        handOffset.position.set(0.4, -0.4, -0.7); // Position for right hand

        // Generate sword using AI
        generateSword();
        
        async function generateSword() {
            try {
                // Generate sword image with AI
                const swordImage = await websim.imageGen({
                    prompt: "A fantasy sword with shiny metal blade and ornate handle, on a solid blue background",
                    aspect_ratio: "1:1"
                });

                // Get image data to process
                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.src = swordImage.url;
                
                img.onload = function() {
                    // Process the image to remove background
                    const transparentSwordUrl = removeSwordBackground(img);
                    
                    // Create textured sword in the scene
                    const swordTexture = new THREE.TextureLoader().load(transparentSwordUrl);
                    swordTexture.flipY = false;
                    
                    const swordMaterial = new THREE.MeshBasicMaterial({ 
                        map: swordTexture,
                        transparent: true,
                        side: THREE.DoubleSide
                    });
                    
                    const swordGeometry = new THREE.PlaneGeometry(0.5, 0.5);
                    sword = new THREE.Mesh(swordGeometry, swordMaterial);
                    
                    // Add sword to hand
                    handOffset.add(sword);
                    
                    // Hide loading screen
                    document.getElementById('loading').style.display = 'none';
                }
            } catch (error) {
                console.error("Error generating sword:", error);
                document.getElementById('loading').innerHTML = 'Error generating sword. Refresh to try again.';
            }
        }
        
        // Function to remove background from sword image
        function removeSwordBackground(img) {
            // Create a canvas to work with the image
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            
            // Draw the image on the canvas
            ctx.drawImage(img, 0, 0);
            
            // Get image data
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            // Sample the background color from the corner
            const bgR = data[0];
            const bgG = data[1];
            const bgB = data[2];
            
            // Set any pixel matching background color to transparent
            // with some tolerance for slight variations
            const tolerance = 50;
            
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                
                // Check if this pixel is close to background color
                if (
                    Math.abs(r - bgR) < tolerance &&
                    Math.abs(g - bgG) < tolerance &&
                    Math.abs(b - bgB) < tolerance
                ) {
                    // Make pixel transparent
                    data[i + 3] = 0;
                }
            }
            
            // Put the processed image data back
            ctx.putImageData(imageData, 0, 0);
            
            // Return the data URL of the processed image
            return canvas.toDataURL();
        }
        
        // Animation loop
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            
            // Handle movement
            const delta = clock.getDelta();
            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;
            
            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();
            
            if (moveForward || moveBackward) velocity.z -= direction.z * 20.0 * delta;
            if (moveLeft || moveRight) velocity.x -= direction.x * 20.0 * delta;
            
            controls.moveRight(-velocity.x * delta);
            controls.moveForward(-velocity.z * delta);
            
            // Render the scene
            renderer.render(scene, camera);
        }
        
        // Handle window resize
        window.addEventListener('resize', onWindowResize, false);
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Start animation
        animate();
    </script>

</body>
</html>
