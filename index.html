<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Walking with Sword</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
            z-index: 1000;
        }
        #instructions {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: white;
            font-family: Arial, sans-serif;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="loading">
        <h2>Generating your sword...</h2>
        <p>Please wait while the AI creates your weapon</p>
    </div>
    <div id="instructions">
        <p>WASD or Arrow Keys: Move | Mouse: Look around</p>
    </div>
    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Sky blue
        
        // Camera setup
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.y = 1.7; // Eye height
        scene.add(camera);
        
        // Renderer setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Enhanced shadow quality
        document.body.appendChild(renderer.domElement);
        
        // Light setup - Enhanced lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5); // Softer ambient light
        scene.add(ambientLight);
        
        // Main directional light with enhanced shadows
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7.5);
        directionalLight.castShadow = true;
        // Improve shadow quality and range
        directionalLight.shadow.mapSize.width = 1024;
        directionalLight.shadow.mapSize.height = 1024;
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 50;
        directionalLight.shadow.camera.left = -20;
        directionalLight.shadow.camera.right = 20;
        directionalLight.shadow.camera.top = 20;
        directionalLight.shadow.camera.bottom = -20;
        directionalLight.shadow.bias = -0.0005;
        scene.add(directionalLight);
        
        // Add spotlight for dramatic effect
        const spotLight = new THREE.SpotLight(0xffffcc, 0.8);
        spotLight.position.set(-5, 8, 2);
        spotLight.angle = Math.PI / 6;
        spotLight.penumbra = 0.3;
        spotLight.castShadow = true;
        spotLight.shadow.mapSize.width = 1024;
        spotLight.shadow.mapSize.height = 1024;
        scene.add(spotLight);
        
        // Add a few random objects to showcase shadows
        function addRandomObjects() {
            const objectGeometry = new THREE.BoxGeometry(1, 1, 1);
            const objectMaterial = new THREE.MeshStandardMaterial({ color: 0xccaa88 });
            
            for (let i = 0; i < 15; i++) {
                const object = new THREE.Mesh(objectGeometry, objectMaterial);
                object.position.x = Math.random() * 20 - 10;
                object.position.z = Math.random() * 20 - 10;
                object.position.y = 0.5;
                object.castShadow = true;
                object.receiveShadow = true;
                scene.add(object);
            }
        }
        addRandomObjects();
        
        // Ground plane
        const planeGeometry = new THREE.PlaneGeometry(2000, 2000);
        const planeMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x339933,
            side: THREE.DoubleSide,
            roughness: 0.8,
            metalness: 0.2
        });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);
        
        // Controls setup
        const controls = new PointerLockControls(camera, document.body);
        
        document.addEventListener('click', function() {
            controls.lock();
        });
        
        controls.addEventListener('lock', function() {
            document.getElementById('instructions').style.display = 'none';
        });
        
        controls.addEventListener('unlock', function() {
            document.getElementById('instructions').style.display = 'block';
        });
        
        // Movement variables
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        
        // Handle key controls
        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);
        
        function onKeyDown(event) {
            switch(event.code) {
                case 'ArrowUp':
                case 'KeyW':
                    moveForward = true;
                    break;
                case 'ArrowLeft':
                case 'KeyA':
                    moveLeft = true;
                    break;
                case 'ArrowDown':
                case 'KeyS':
                    moveBackward = true;
                    break;
                case 'ArrowRight':
                case 'KeyD':
                    moveRight = true;
                    break;
            }
        }
        
        function onKeyUp(event) {
            switch(event.code) {
                case 'ArrowUp':
                case 'KeyW':
                    moveForward = false;
                    break;
                case 'ArrowLeft':
                case 'KeyA':
                    moveLeft = false;
                    break;
                case 'ArrowDown':
                case 'KeyS':
                    moveBackward = false;
                    break;
                case 'ArrowRight':
                case 'KeyD':
                    moveRight = false;
                    break;
            }
        }
        
        // Modify the hand offset position and rotation for better visibility
        let sword = null;
        let handOffset = new THREE.Object3D();
        camera.add(handOffset);
        handOffset.position.set(0.5, -0.3, -1); // Moved up a bit more
        
        // Generate sword using AI
        generateSword();
        
        async function generateSword() {
            try {
                const swordImage = await websim.imageGen({
                    prompt: "A vertical fantasy sword standing upright with blade pointing up and handle at bottom, ornate metal handle at the bottom and shiny blade extending upward, centered on pure blue background, full sword visible in frame",
                    aspect_ratio: "1:1"
                });

                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.src = swordImage.url;
                
                img.onload = function() {
                    const transparentSwordUrl = removeSwordBackground(img);
                    
                    const swordTexture = new THREE.TextureLoader().load(transparentSwordUrl);
                    swordTexture.flipY = false;
                    
                    // Use MeshStandardMaterial instead of MeshBasicMaterial for lighting effects
                    const swordMaterial = new THREE.MeshStandardMaterial({ 
                        map: swordTexture,
                        transparent: true,
                        side: THREE.DoubleSide,
                        alphaTest: 0.5,
                        roughness: 0.4,
                        metalness: 0.7 // Makes it look more like metal
                    });
                    
                    const swordGeometry = new THREE.PlaneGeometry(1, 1);
                    sword = new THREE.Mesh(swordGeometry, swordMaterial);
                    
                    sword.rotation.y = Math.PI / 2;
                    sword.rotation.z = -Math.PI / 8;
                    sword.rotation.x = Math.PI / 6 + Math.PI; 
                    
                    // Enable shadows on the sword
                    sword.castShadow = true;
                    sword.receiveShadow = true;
                    
                    handOffset.add(sword);
                    
                    document.getElementById('loading').style.display = 'none';
                    
                    console.log("Sword added to scene", sword);
                }
            } catch (error) {
                console.error("Error generating sword:", error);
                document.getElementById('loading').innerHTML = 'Error generating sword. Refresh to try again.';
            }
        }
        
        // Function to remove background from sword image
        function removeSwordBackground(img) {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            
            ctx.drawImage(img, 0, 0);
            
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            const bgR = data[0];
            const bgG = data[1];
            const bgB = data[2];
            
            const tolerance = 50;
            
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                
                if (
                    Math.abs(r - bgR) < tolerance &&
                    Math.abs(g - bgG) < tolerance &&
                    Math.abs(b - bgB) < tolerance
                ) {
                    data[i + 3] = 0;
                }
            }
            
            ctx.putImageData(imageData, 0, 0);
            
            return canvas.toDataURL();
        }
        
        // Animation loop
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;
            
            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();
            
            if (moveForward || moveBackward) velocity.z -= direction.z * 20.0 * delta;
            if (moveLeft || moveRight) velocity.x -= direction.x * 20.0 * delta;
            
            controls.moveRight(-velocity.x * delta);
            controls.moveForward(-velocity.z * delta);
            
            if (sword) {
                sword.rotation.z = -Math.PI / 8 + Math.sin(clock.elapsedTime * 2) * 0.05;
                sword.rotation.x = Math.PI / 6 + Math.PI; 
            }
            
            // Animate the spotlight for dramatic effect
            if (spotLight) {
                spotLight.position.x = Math.sin(clock.elapsedTime * 0.5) * 8;
                spotLight.position.z = Math.cos(clock.elapsedTime * 0.5) * 8;
            }
            
            renderer.render(scene, camera);
        }
        
        // Handle window resize
        window.addEventListener('resize', onWindowResize, false);
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Start animation
        animate();
    </script>

</body>
</html>
