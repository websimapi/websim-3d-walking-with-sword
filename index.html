<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Walking with Sword</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
            z-index: 1000;
        }
        #instructions {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: white;
            font-family: Arial, sans-serif;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="loading">
        <h2>Generating your sword...</h2>
        <p>Please wait while the AI creates your weapon</p>
    </div>
    <div id="instructions">
        <p>WASD or Arrow Keys: Move | Mouse: Look around</p>
    </div>
    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
        import { PMREMGenerator } from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';

        // Scene setup
        const scene = new THREE.Scene();
        
        // Camera setup
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.y = 1.7; // Eye height
        scene.add(camera);
        
        // Renderer setup with improved settings
        const renderer = new THREE.WebGLRenderer({ 
            antialias: true,
            powerPreference: "high-performance"
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        
        // Enable physically correct lighting
        renderer.physicallyCorrectLights = true;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        
        // Improved shadow settings
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.shadowMap.autoUpdate = true;
        document.body.appendChild(renderer.domElement);
        
        // Post-processing setup with focus on high-quality shadows
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);
        
        // FXAA for anti-aliasing (better quality than the blurry SSAO pass)
        const fxaaPass = new ShaderPass(FXAAShader);
        const pixelRatio = renderer.getPixelRatio();
        fxaaPass.material.uniforms['resolution'].value.x = 1 / (window.innerWidth * pixelRatio);
        fxaaPass.material.uniforms['resolution'].value.y = 1 / (window.innerHeight * pixelRatio);
        composer.addPass(fxaaPass);
        
        // Selective bloom effect for the sword
        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.8,  // strength - increased for better sword visibility
            0.3,  // radius - increased slightly for softer glow
            0.4   // threshold - lowered to make more of the sword glow
        );
        composer.addPass(bloomPass);
        
        // Final output pass
        const outputPass = new OutputPass();
        composer.addPass(outputPass);
        
        // Load HDR environment map
        const pmremGenerator = new PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();
        
        new RGBELoader()
            .load('https://threejs.org/examples/textures/equirectangular/venice_sunset_1k.hdr', function(texture) {
                const envMap = pmremGenerator.fromEquirectangular(texture).texture;
                scene.environment = envMap;
                scene.background = new THREE.Color(0x87ceeb); // Keep sky blue
                
                texture.dispose();
                pmremGenerator.dispose();
            });
        
        // Enhanced lighting setup for better shadows
        const ambientLight = new THREE.AmbientLight(0x404040, 0.2); // Slightly dimmer ambient
        scene.add(ambientLight);
        
        // Hemisphere light for sky/ground illumination
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.5);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);
        
        // Main directional light (sun) - improved for better shadows
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
        directionalLight.position.set(-5, 15, 8);
        directionalLight.castShadow = true;
        
        // Higher resolution shadow map for sharper shadows
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 50;
        directionalLight.shadow.camera.left = -20;
        directionalLight.shadow.camera.right = 20;
        directionalLight.shadow.camera.top = 20;
        directionalLight.shadow.camera.bottom = -20;
        directionalLight.shadow.bias = -0.0003; // Reduced bias for sharper shadows
        directionalLight.shadow.mapSize.width = 4096; // Increased resolution
        directionalLight.shadow.mapSize.height = 4096; // Increased resolution
        directionalLight.shadow.radius = 1; // Smaller radius for sharper shadows
        scene.add(directionalLight);
        
        // Add a fill light
        const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
        fillLight.position.set(5, 5, -5);
        scene.add(fillLight);
        
        // Add a spotlight specifically to highlight the sword
        const swordLight = new THREE.SpotLight(0x7777ff, 2.0);
        swordLight.position.set(0, 3, 0);
        swordLight.angle = Math.PI / 6;
        swordLight.penumbra = 0.2;
        swordLight.decay = 2;
        swordLight.distance = 10;
        camera.add(swordLight);
        swordLight.target = camera;
        
        // Ground plane with PBR material
        const planeGeometry = new THREE.PlaneGeometry(2000, 2000, 128, 128);
        const planeMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x339933,
            side: THREE.DoubleSide,
            roughness: 0.8,
            metalness: 0.1,
            envMapIntensity: 0.5
        });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);
        
        // Add some random objects to show off lighting effects
        function addRandomObjects() {
            // Add some rocks and trees
            for (let i = 0; i < 50; i++) {
                // Random position away from the player
                let x = Math.random() * 100 - 50;
                let z = Math.random() * 100 - 50;
                
                // Ensure objects aren't too close to the player
                if (Math.abs(x) < 5 && Math.abs(z) < 5) continue;
                
                // Create a rock or tree
                if (Math.random() > 0.5) {
                    // Rock
                    const rockGeometry = new THREE.DodecahedronGeometry(Math.random() * 1 + 0.5, 0);
                    const rockMaterial = new THREE.MeshStandardMaterial({
                        color: 0x888888,
                        roughness: 0.9,
                        metalness: 0.1,
                        envMapIntensity: 0.5
                    });
                    const rock = new THREE.Mesh(rockGeometry, rockMaterial);
                    rock.position.set(x, rockGeometry.parameters.radius * 0.5, z);
                    rock.castShadow = true;
                    rock.receiveShadow = true;
                    scene.add(rock);
                } else {
                    // Tree (simple cylinder and cone)
                    const trunkGeometry = new THREE.CylinderGeometry(0.2, 0.3, 1.5, 8);
                    const trunkMaterial = new THREE.MeshStandardMaterial({
                        color: 0x8B4513,
                        roughness: 0.9,
                        metalness: 0.0
                    });
                    const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
                    trunk.position.set(x, 0.75, z);
                    trunk.castShadow = true;
                    trunk.receiveShadow = true;
                    
                    const leavesGeometry = new THREE.ConeGeometry(1, 2, 8);
                    const leavesMaterial = new THREE.MeshStandardMaterial({
                        color: 0x1a472a,
                        roughness: 0.8,
                        metalness: 0.0
                    });
                    const leaves = new THREE.Mesh(leavesGeometry, leavesMaterial);
                    leaves.position.set(x, 2.5, z);
                    leaves.castShadow = true;
                    
                    scene.add(trunk);
                    scene.add(leaves);
                }
            }
        }
        
        addRandomObjects();
        
        // Controls setup
        const controls = new PointerLockControls(camera, document.body);
        
        document.addEventListener('click', function() {
            controls.lock();
        });
        
        controls.addEventListener('lock', function() {
            document.getElementById('instructions').style.display = 'none';
        });
        
        controls.addEventListener('unlock', function() {
            document.getElementById('instructions').style.display = 'block';
        });
        
        // Movement variables
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        
        // Handle key controls
        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);
        
        function onKeyDown(event) {
            switch(event.code) {
                case 'ArrowUp':
                case 'KeyW':
                    moveForward = true;
                    break;
                case 'ArrowLeft':
                case 'KeyA':
                    moveLeft = true;
                    break;
                case 'ArrowDown':
                case 'KeyS':
                    moveBackward = true;
                    break;
                case 'ArrowRight':
                case 'KeyD':
                    moveRight = true;
                    break;
            }
        }
        
        function onKeyUp(event) {
            switch(event.code) {
                case 'ArrowUp':
                case 'KeyW':
                    moveForward = false;
                    break;
                case 'ArrowLeft':
                case 'KeyA':
                    moveLeft = false;
                    break;
                case 'ArrowDown':
                case 'KeyS':
                    moveBackward = false;
                    break;
                case 'ArrowRight':
                case 'KeyD':
                    moveRight = false;
                    break;
            }
        }
        
        // Modify the hand offset position and rotation for better visibility
        let sword = null;
        let handOffset = new THREE.Object3D();
        camera.add(handOffset);
        handOffset.position.set(0.5, -0.2, -1); // Moved up a bit more
        
        // Sword glow container (renamed from swordParticles)
        const swordGlowEffects = new THREE.Group();
        handOffset.add(swordGlowEffects);
        
        // Generate sword using AI
        generateSword();
        
        async function generateSword() {
            try {
                const swordImage = await websim.imageGen({
                    prompt: "A vertical fantasy sword standing upright with blade pointing up and handle at bottom, ornate metal handle at the bottom and shiny enchanted blade extending upward with blue magical runes, centered on pure blue background, full sword visible in frame",
                    aspect_ratio: "1:1"
                });

                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.src = swordImage.url;
                
                img.onload = function() {
                    const transparentSwordUrl = removeSwordBackground(img);
                    
                    const swordTexture = new THREE.TextureLoader().load(transparentSwordUrl);
                    swordTexture.flipY = false;
                    
                    // Enhanced sword material with stronger emissive glow
                    const swordMaterial = new THREE.MeshStandardMaterial({ 
                        map: swordTexture,
                        transparent: true,
                        side: THREE.DoubleSide,
                        alphaTest: 0.5,
                        emissive: 0x4466ff,
                        emissiveIntensity: 0.8,
                        metalness: 0.9,
                        roughness: 0.1,
                        envMapIntensity: 1.5
                    });
                    
                    // Create a slightly thicker plane for better shadow casting
                    const swordGeometry = new THREE.PlaneGeometry(1, 1);
                    sword = new THREE.Mesh(swordGeometry, swordMaterial);
                    
                    // Set up sword positioning
                    sword.rotation.y = Math.PI / 2;
                    sword.rotation.z = -Math.PI / 8;
                    sword.rotation.x = Math.PI / 6 + Math.PI; 
                    
                    // Enable shadow casting for the sword
                    sword.castShadow = true;
                    sword.receiveShadow = false;
                    
                    handOffset.add(sword);
                    
                    // Add sword glow effect without particles
                    addSwordGlowEffect();
                    
                    document.getElementById('loading').style.display = 'none';
                }
            } catch (error) {
                console.error("Error generating sword:", error);
                document.getElementById('loading').innerHTML = 'Error generating sword. Refresh to try again.';
            }
        }
        
        // Function to create a glow effect around the sword without particles
        function addSwordGlowEffect() {
            // Add a subtle blue light at the sword's position
            const swordPointLight = new THREE.PointLight(0x3366ff, 2, 2);
            swordPointLight.position.set(0, 0, 0);
            swordGlowEffects.add(swordPointLight);
            
            // Add a second light for additional glow effect
            const secondGlowLight = new THREE.PointLight(0x00aaff, 1.5, 1.5);
            secondGlowLight.position.set(0, 0.2, 0);
            swordGlowEffects.add(secondGlowLight);
        }
        
        // Function to remove background from sword image
        function removeSwordBackground(img) {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            
            ctx.drawImage(img, 0, 0);
            
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            const bgR = data[0];
            const bgG = data[1];
            const bgB = data[2];
            
            const tolerance = 50;
            
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                
                if (
                    Math.abs(r - bgR) < tolerance &&
                    Math.abs(g - bgG) < tolerance &&
                    Math.abs(b - bgB) < tolerance
                ) {
                    data[i + 3] = 0;
                }
            }
            
            ctx.putImageData(imageData, 0, 0);
            
            return canvas.toDataURL();
        }
        
        // Animation loop
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;
            
            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();
            
            if (moveForward || moveBackward) velocity.z -= direction.z * 20.0 * delta;
            if (moveLeft || moveRight) velocity.x -= direction.x * 20.0 * delta;
            
            controls.moveRight(-velocity.x * delta);
            controls.moveForward(-velocity.z * delta);
            
            // Enhanced sword animation
            if (sword) {
                sword.rotation.z = -Math.PI / 8 + Math.sin(clock.elapsedTime * 2) * 0.05;
                sword.rotation.x = Math.PI / 6 + Math.PI + Math.sin(clock.elapsedTime * 1.5) * 0.03; 
                
                // Pulse the emissive intensity for a magical effect
                if (sword.material) {
                    sword.material.emissiveIntensity = 0.6 + Math.sin(clock.elapsedTime * 5) * 0.4;
                }
            }
            
            // Animate glow effects
            if (swordGlowEffects && swordGlowEffects.children.length > 0) {
                for (let i = 0; i < swordGlowEffects.children.length; i++) {
                    const glowEffect = swordGlowEffects.children[i];
                    if (glowEffect.type === 'PointLight') {
                        // Animate light intensity
                        glowEffect.intensity = (glowEffect.intensity * 0.95) + 
                            (1.5 + Math.sin(clock.elapsedTime * 3 + i) * 0.5) * 0.05;
                    }
                }
            }
            
            // Use composer instead of renderer
            composer.render();
        }
        
        // Handle window resize
        window.addEventListener('resize', onWindowResize, false);
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            
            // Update FXAA uniforms
            const pixelRatio = renderer.getPixelRatio();
            fxaaPass.material.uniforms['resolution'].value.x = 1 / (window.innerWidth * pixelRatio);
            fxaaPass.material.uniforms['resolution'].value.y = 1 / (window.innerHeight * pixelRatio);
        }
        
        // Start animation
        animate();
    </script>

</body>
</html>
